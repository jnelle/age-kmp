org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true

kotlin.code.style=official
android.useAndroidX=true

GROUP=io.github.jnelle
VERSION_NAME=0.2.0-SNAPSHOT

POM_NAME=age-kmp
POM_DESCRIPTION=age file encryption for Kotlin Multiplatform, backed by the Rust reference implementation via UniFFI.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/jnelle/age-kmp

POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/jnelle/age-kmp
POM_SCM_CONNECTION=scm:git:git://github.com/jnelle/age-kmp.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/jnelle/age-kmp.git

POM_DEVELOPER_ID=jnelle
POM_DEVELOPER_NAME=jnelle
POM_DEVELOPER_URL=https://github.com/jnelle

# AGP 9 routes KMP modules through com.android.kotlin.multiplatform.library, which gobley 0.3.7
# does not know. Keep the legacy androidTarget path until gobley ships support for the new DSL.
android.builtInKotlin=false
android.newDsl=false
android.sourceset.disallowProvider=false
kotlin.mpp.enableCInteropCommonization=true
